<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chat</title>
  <style>
    /* ====== Chat Container ====== */
    body {
      font-family: Arial, sans-serif;
      background: #ece5dd;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chat-container {
      display: flex;
      flex-direction: column;
      width: 400px;
      height: 600px;
      background: #ffffff;
      border: 1px solid #ccc;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    /* ====== Chat Header ====== */
    #chatWith {
      background: #075e54;
      color: white;
      text-align: center;
      padding: 12px;
      font-size: 18px;
      font-weight: bold;
    }

    /* ====== Messages Area ====== */
    .messages {
      flex-grow: 1;
      padding: 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      background: #e5ddd5;
    }

    .message {
      padding: 8px 12px;
      margin: 6px 0;
      border-radius: 8px;
      max-width: 70%;
      font-size: 14px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    /* Your messages */
    .sent {
      background: #dcf8c6;
      align-self: flex-end;
      text-align: right;
      border-bottom-right-radius: 0;
    }

    /* Received messages */
    .received {
      background: #fff;
      align-self: flex-start;
      text-align: left;
      border-bottom-left-radius: 0;
    }

    /* ====== Input Area ====== */
    .chat-input {
      display: flex;
      padding: 10px;
      background: #f0f0f0;
      border-top: 1px solid #ccc;
    }

    #messageInput {
      flex-grow: 1;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 20px;
      outline: none;
      font-size: 14px;
    }

    #sendBtn {
      margin-left: 10px;
      padding: 8px 16px;
      background: #075e54;
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    #sendBtn:hover {
      background: #128c7e;
    }

    /* ====== Scrollbar Styling ====== */
    .messages::-webkit-scrollbar {
      width: 6px;
    }

    .messages::-webkit-scrollbar-thumb {
      background: rgba(0,0,0,0.3);
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <h2 id="chatWith">Chat</h2>

    <!-- Chat Messages -->
    <div id="messages" class="messages"></div>

    <!-- Input Area -->
    <div class="chat-input">
      <input type="text" id="messageInput" placeholder="Type a message..." />
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <script src="chat.js"></script>
</body>
</html>
