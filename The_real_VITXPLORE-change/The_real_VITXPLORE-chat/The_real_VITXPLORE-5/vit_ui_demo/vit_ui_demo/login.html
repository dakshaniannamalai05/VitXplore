<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - VITXPLORE</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .error-msg {
      color: red;
      font-size: 0.9rem;
      margin-top: 10px;
    }
    .success-msg {
      color: green;
      font-size: 0.9rem;
      margin-top: 10px;
    }
  </style>
</head>
<body class="auth-page">

  <div class="auth-container">
    <!-- Login Icon -->
    <img src="login.png" alt="Login Icon" class="login-icon">

    <!-- Brand Title -->
    <h1 class="brand-title">VIT<span class="highlight">XPLORE</span></h1>
    <h2 class="form-title">Login</h2>

    <!-- Login Form -->
    <form id="loginForm" class="form" novalidate>
      <input type="email" id="email" name="email" placeholder="Email" required>
      <input type="password" id="password" name="password" placeholder="Password" required>
      <button type="button" id="btnLogin" class="primary-btn big-btn">Login</button>
      <p id="msg"></p>
    </form>

    <!-- Switch to Register -->
    <p class="switch-auth">
      Don’t have an account? <a href="register.html">Register here</a>
    </p>
  </div>

  <!-- External JS file to bypass CSP -->
  <script src="login.js"></script>
</body>
</html>
